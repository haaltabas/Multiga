<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super app per multiplicar! :D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
		


        <div id="menu-screen">

			<h1>👑 Aventura de multiplicar</h1>

			<div id="map-container">

				<div id="castle">
					<img src=assets/images/castell1.png></img>
					<div class="castle-label">Castell del Super regal</div>
				</div>
				
				<div id="adventure-map"></div>

			</div>

		</div>

        <div id="quiz-screen" class="screen hidden">

			<button id="close-quiz" onclick="goBackToMap()">
				❌
			</button>
			
            <h2 id="quiz-title"></h2>			
			<p id="story"></p>

            <div id="progress"></div>
            <div id="question"></div>			
			<div id="timer"></div>	
			<div id="timer-bar">
				<div id="timer-fill"></div>
			</div>			
			<div id="numeric-container" class="hidden">

				<input id="answer-input" type="text" readonly value="">

				<div id="keypad">
					<button class="keypad-btn">1</button>
					<button class="keypad-btn">2</button>
					<button class="keypad-btn">3</button>

					<button class="keypad-btn">4</button>
					<button class="keypad-btn">5</button>
					<button class="keypad-btn">6</button>

					<button class="keypad-btn">7</button>
					<button class="keypad-btn">8</button>
					<button class="keypad-btn">9</button>

					<button class="keypad-btn">⌫</button>
					<button class="keypad-btn">0</button>
					<button class="keypad-btn">✅</button>
				</div>
			</div>


            <div id="answers"></div>
        </div>



        <div id="result-screen" class="screen hidden">
            <h1>🎉 Quiz Finished! 🎉</h1>

            <p id="score-text"></p>

            <button onclick="goHome()">Go back to the map</button>
        </div>
		
		<div id="toast-container"></div>
		<div id="achievements"></div>
    </div>

<script src="js/confetti.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>

</body>
</html>
